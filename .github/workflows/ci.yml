name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holdfast
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d holdfast"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/holdfast
      SESSION_SECRET: ci-test-session-secret-at-least-32-characters-long
      APP_URL: http://localhost:3000
      AI_MODE: replay
      DEMO_MODE: false
      PAYPAL_API_BASE: https://api-m.sandbox.paypal.com
      WORKER_DISABLED: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
